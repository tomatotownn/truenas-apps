{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.smokeping_container_name, "image") %}

{% do c1.add_caps(["NET_RAW", "CHOWN"]) %}
{% do c1.healthcheck.disable() %}

{% do c1.add_storage("/config", values.storage.data) %}

{% if values.network.host_network %}
  {% do c1.set_network_mode("host") %}
{% else %}
  {% do c1.add_port(values.network.web_port, {"container_port": 80}) %}
{% endif %}

{% do c1.environment.add_env("TZ", values.smokeping.timezone) %}
{% do c1.environment.add_env("PUID", values.consts.run_as_user) %}
{% do c1.environment.add_env("PGID", values.consts.run_as_group) %}
{% do c1.environment.add_user_envs(values.smokeping.additional_envs) %}

{% if not values.network.host_network %}
  {% do tpl.portals.add(values.network.web_port) %}
{% endif %}

{{ tpl.render() | tojson }}
